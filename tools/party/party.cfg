# party.cfg : the settings for the PILLAGERS PARTY shortcut (tools\party\party.ps1). One setting per line, NAME=value. Lines starting # are notes.
# Change a value, save, and double click "Pillagers Party" on the desktop again.

# The game address. Until the 10/29 evening lock use the newest build (dark_raiders.html). After the lock use the locked build:
#   http://localhost:8802/stable.html
URL_BASE=http://localhost:8802/dark_raiders.html

# Which Windows screen number is player 1's TV and which is player 2's. The numbers are the ones Windows shows with
# Settings > System > Display > Identify. To list them from here: powershell -File tools\party\party.ps1 -ShowScreens
P1_DISPLAY=1
P2_DISPLAY=2

# 0 = the game as it is today: only player 1's window is opened, on the title screen; one click on "2 PLAYER ARCADE DEMO" opens
#     player 2's window, and this script then puts it full screen on player 2's TV by itself.
# 1 = ONLY after the game supports ?party=1 (task tools\handoff\console\tasks\05-party-launch-mode.md is shipped): both windows
#     open straight onto the attract screen with Career and the stash out of reach.
URL_OPTIONS=0

# Chrome, and the party's own Chrome profile (its own save and scoreboard, kept apart from your normal Chrome).
CHROME=C:\Program Files\Google\Chrome\Application\chrome.exe
PROFILE=%LOCALAPPDATA%\PillagersParty\chrome

# 1 = the script presses F11 for each window (and again if a window leaves full screen). 0 = it only moves them.
FULLSCREEN=1
