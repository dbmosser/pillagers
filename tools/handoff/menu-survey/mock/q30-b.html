<style>
:root{--panel:#14171a;--raised:#1e2225;--line:#2e3337;--line-hi:#4a5257;--text:#f2efe6;--muted:#a9a79e;--lime:#e4ff2e;--ink:#0d1200;--danger:#ff5a3c}
*{box-sizing:border-box;margin:0;padding:0}

.abs{position:absolute}

.ico{display:block;flex:none}

.pad.sh{border-radius:10px;width:auto;min-width:46px;padding:0 10px;height:34px;font-size:19px}
.close{position:absolute;width:56px;height:56px;border-radius:4px;border:1px solid var(--line-hi);display:flex;align-items:center;justify-content:center;color:var(--text);background:transparent}
.ghost{position:absolute;height:56px;padding:0 28px;border-radius:4px;border:1px solid var(--line-hi);display:flex;align-items:center;gap:12px;font-size:24px;font-weight:600;color:var(--text);background:rgba(255,255,255,.03)}
.card{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 30px 90px rgba(0,0,0,.55)}

.card{left:96px;top:54px;width:1728px;height:972px;box-shadow:0 0 0 1px var(--line),0 30px 90px rgba(0,0,0,.55);border:0}
.hdr{position:absolute;left:136px;top:82px;font-size:48px;line-height:56px;font-weight:700}
.close{left:1744px;top:82px}
.r{position:absolute;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);font-size:28px;font-weight:500}
.r.on{background:linear-gradient(90deg,rgba(228,255,46,.20),rgba(228,255,46,.07));border-bottom-color:transparent;font-weight:600}
.r.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--lime)}
.step{display:flex;align-items:center;gap:6px}
.step svg{color:var(--muted)}
.r.on .step svg{color:var(--lime)}
.v{min-width:116px;text-align:center;font-weight:600}
.hint{bottom:7px}

  .rail{position:absolute;left:136px;top:190px;width:320px}

  .rail div.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--lime)}

  .hb{position:absolute;left:96px;top:970px;width:1728px;height:56px;background:var(--raised);border-top:1px solid var(--line);border-radius:0 0 4px 4px;display:flex;align-items:center;padding-left:40px;font-size:24px;color:var(--muted)}
