.ghost{position:absolute;height:56px;padding:0 28px;border-radius:4px;border:1px solid var(--line-hi);display:flex;align-items:center;gap:12px;font-size:24px;font-weight:600;color:var(--text);background:rgba(255,255,255,.03)}
.card{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 30px 90px rgba(0,0,0,.55)}

.close{left:1744px;top:82px}

.r.on{background:linear-gradient(90deg,rgba(228,255,46,.20),rgba(228,255,46,.07));border-bottom-color:transparent;font-weight:600}
.r.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--lime)}
.step{display:flex;align-items:center;gap:6px}
.step svg{color:var(--muted)}
.r.on .step svg{color:var(--lime)}
.v{min-width:116px;text-align:center;font-weight:600}
.hint{bottom:7px}

  .t{position:absolute;width:480px;height:240px;border-radius:4px;background:var(--raised);border:1px solid var(--line);padding:32px 36px}
  .t .ic{color:var(--text)}

  .inset .in{position:absolute;left:0;top:0;width:960px;height:540px;transform:scale(.5);transform-origin:0 0}
  .inset .in .r{font-size:32px;width:880px!important}
  .inset .in .hdr{font-size:52px}
  .inset .in .hdr{left:40px;top:28px}
  .inset .in .backb{position:absolute;left:40px;top:28px;width:56px;height:56px;border:1px solid var(--line-hi);border-radius:4px;display:flex;align-items:center;justify-content:center}
