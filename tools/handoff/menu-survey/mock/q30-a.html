<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>q30 A tabs on top</title>
<style>
:root{--panel:#14171a;--raised:#1e2225;--line:#2e3337;--line-hi:#4a5257;--text:#f2efe6;--muted:#a9a79e;--lime:#e4ff2e;--ink:#0d1200;--danger:#ff5a3c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0b0c0d}
body{position:relative;font-family:Bahnschrift,"Segoe UI Variable Display","Segoe UI",sans-serif;font-weight:500;color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:.01em}
.abs{position:absolute}
.bd{position:absolute;background-repeat:no-repeat}
.dim{position:absolute;inset:0}
.ico{display:block;flex:none}
.hint{position:absolute;left:0;right:0;bottom:40px;display:flex;justify-content:center;align-items:center;gap:44px;font-size:24px;color:var(--muted);font-weight:500}
.hint span.it{display:flex;align-items:center;gap:12px}
.pad{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:2px solid #6b7176;background:rgba(20,23,26,.9);color:var(--text);font-size:21px;font-weight:700;letter-spacing:0}
.pad.sh{border-radius:10px;width:auto;min-width:46px;padding:0 10px;height:34px;font-size:19px}
.close{position:absolute;width:56px;height:56px;border-radius:4px;border:1px solid var(--line-hi);display:flex;align-items:center;justify-content:center;color:var(--text);background:transparent}
.ghost{position:absolute;height:56px;padding:0 28px;border-radius:4px;border:1px solid var(--line-hi);display:flex;align-items:center;gap:12px;font-size:24px;font-weight:600;color:var(--text);background:rgba(255,255,255,.03)}
.card{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 30px 90px rgba(0,0,0,.55)}

.card{left:96px;top:54px;width:1728px;height:972px;box-shadow:0 0 0 1px var(--line),0 30px 90px rgba(0,0,0,.55);border:0}
.hdr{position:absolute;left:136px;top:82px;font-size:48px;line-height:56px;font-weight:700}
.close{left:1744px;top:82px}
.r{position:absolute;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);font-size:28px;font-weight:500}
.r.on{background:linear-gradient(90deg,rgba(228,255,46,.20),rgba(228,255,46,.07));border-bottom-color:transparent;font-weight:600}
.r.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--lime)}
.step{display:flex;align-items:center;gap:6px}
.step svg{color:var(--muted)}
.r.on .step svg{color:var(--lime)}
.v{min-width:116px;text-align:center;font-weight:600}
.hint{bottom:7px}

  .strip{position:absolute;left:136px;top:152px;width:1648px;height:56px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
  .strip .tabs{flex:1;display:flex;justify-content:space-around;align-items:stretch;height:56px;padding:0 24px}
  .tab{display:flex;align-items:center;font-size:28px;font-weight:600;color:var(--muted);height:56px;padding:0 6px;position:relative}
  .tab.on{color:#fff}
  .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;background:var(--lime)}
  .help{position:absolute;left:1100px;top:230px;width:560px;height:420px;background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:40px}
  .help .n{font-size:32px;line-height:40px;font-weight:700;margin-top:30px}
  .help .t{font-size:24px;line-height:32px;color:var(--muted);margin-top:14px;font-weight:500}
  .help svg{color:var(--muted)}
  </style></head>
