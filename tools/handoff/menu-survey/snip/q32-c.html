<style>
.q32-c{text-transform:lowercase;width:560px;font-family:Bahnschrift,"Segoe UI Variable Display","Segoe UI",sans-serif;color:#f2efe6;-webkit-font-smoothing:antialiased;box-sizing:border-box}
.q32-c *{box-sizing:border-box;margin:0;padding:0}
.q32-c-stage{position:relative;width:560px;height:320px;background:#0b0c0d;border-radius:8px;overflow:hidden}
.q32-c-card{position:absolute;left:10px;top:10px;width:540px;height:300px;background:#14171a;border:1px solid #2e3337;border-radius:4px;overflow:hidden}
.q32-c-tabs{position:absolute;left:0;right:0;top:0;height:56px;border-bottom:1px solid #2e3337}
.q32-c-tab{position:absolute;top:0;height:56px;line-height:54px;font-size:28px;font-weight:600;color:#a9a79e;transition:color .12s linear;white-space:nowrap}
.q32-c-tab.on{color:#fff}
.q32-c-ul{position:absolute;left:0;top:52px;height:4px;width:60px;background:#e4ff2e;will-change:transform,width}
.q32-c-clip{position:absolute;left:0;right:0;top:64px;bottom:0;overflow:hidden}
.q32-c-page{position:absolute;left:0;top:0;width:100%;height:100%;will-change:transform,opacity}
.q32-c-row{position:absolute;left:54px;width:432px;height:52px;display:flex;align-items:center;justify-content:space-between;font-size:22px;font-weight:500;border-bottom:1px solid #2e3337;will-change:transform,opacity}
.q32-c-row b{font-weight:600}
.q32-c-cap{margin-top:10px;font-size:15px;line-height:20px;color:#a9a79e;letter-spacing:.01em}
</style>
<div class="q32-c" id="q32-c">
  <div class="q32-c-stage"><div class="q32-c-card">
    <div class="q32-c-tabs"><span class="q32-c-tab on" style="left:54px">raid</span><span class="q32-c-tab" style="left:154px">audio</span><span class="q32-c-tab" style="left:270px">controls</span><i class="q32-c-ul"></i></div>
    <div class="q32-c-clip"><div class="q32-c-page" style=""><div class="q32-c-row" style="top:0px"><span>shared sight</span><b>on</b></div><div class="q32-c-row" style="top:52px"><span>superhot mode</span><b>off</b></div><div class="q32-c-row" style="top:104px"><span>edit the words</span><b>off</b></div><div class="q32-c-row" style="top:156px"><span>raid length</span><b>10 min</b></div></div><div class="q32-c-page" style="opacity:0;visibility:hidden"><div class="q32-c-row" style="top:0px"><span>master volume</span><b>full</b></div><div class="q32-c-row" style="top:52px"><span>sound effects</span><b>full</b></div><div class="q32-c-row" style="top:104px"><span>music</span><b>off</b></div><div class="q32-c-row" style="top:156px"><span>subtitles</span><b>on</b></div></div><div class="q32-c-page" style="opacity:0;visibility:hidden"><div class="q32-c-row" style="top:0px"><span>move up</span><b>w</b></div><div class="q32-c-row" style="top:52px"><span>move down</span><b>s</b></div><div class="q32-c-row" style="top:104px"><span>dodge roll</span><b>space</b></div><div class="q32-c-row" style="top:156px"><span>reload</span><b>r</b></div></div></div>
  </div></div>
  <div class="q32-c-cap">rows rise in, one after another</div>
</div>
<script>
(function(){
  var root=document.getElementById('q32-c'); if(!root||root.getAttribute('data-q')) return; root.setAttribute('data-q','1');
  var tabs=root.querySelectorAll('.q32-c-tab'), ul=root.querySelector('.q32-c-ul'), pages=root.querySelectorAll('.q32-c-page');
  var rows=[]; for(var i=0;i<pages.length;i++) rows.push(pages[i].querySelectorAll('.q32-c-row'));
  var cycle=[0,1,2,1], step=0, cur=0, prev=0, dir=1, HOLD=1200, t0=null, last=0, END=600;
  function bez(a,b,c,d){return function(x){if(x<=0)return 0;if(x>=1)return 1;var lo=0,hi=1,t=x,i,mt;for(i=0;i<30;i++){mt=1-t;var cx=3*mt*mt*t*a+3*mt*t*t*c+t*t*t;if(Math.abs(cx-x)<1e-6)break;if(cx<x)lo=t;else hi=t;t=(lo+hi)/2;}mt=1-t;return 3*mt*mt*t*b+3*mt*t*t*d+t*t*t;};}
  function cl(v){return v<0?0:(v>1?1:v);}
  var E=bez(.2,.8,.2,1);
  var tx=[],tw=[]; function measure(){for(var i=0;i<tabs.length;i++){tx[i]=tabs[i].offsetLeft;tw[i]=tabs[i].offsetWidth;}}
  measure();
  var ux=tx[0],uw=tw[0],ux0=ux,uw0=uw,vx=0,vw=0;
  function put(){ul.style.transform='translateX('+ux.toFixed(2)+'px)';ul.style.width=uw.toFixed(2)+'px';}
  put();
  function showOnly(k){for(var i=0;i<pages.length;i++){var on=(i===k);pages[i].style.visibility=on?'visible':'hidden';pages[i].style.opacity=on?1:0;pages[i].style.transform='none';for(var j=0;j<rows[i].length;j++){rows[i][j].style.opacity=1;rows[i][j].style.transform='none';}}}
  
  function begin(){ }
  function frame(t,dt){
    var k=1-Math.exp(-dt/0.035); ux+=(tx[cur]-ux)*k; uw+=(tw[cur]-uw)*k;
    var o=pages[prev], n=pages[cur], p=cl(t/80);
    o.style.opacity=1-p; o.style.transform='none'; if(p>=1) o.style.visibility='hidden';
    n.style.opacity=1; n.style.transform='none';
    for(var i=0;i<rows[cur].length;i++){ var q=E(cl((t-i*25)/160)); rows[cur][i].style.opacity=q.toFixed(3); rows[cur][i].style.transform='translateY('+(12*(1-q)).toFixed(2)+'px)'; }
  }
  function settle(dt){ var k=1-Math.exp(-dt/0.035); ux+=(tx[cur]-ux)*k; uw+=(tw[cur]-uw)*k; showOnly(cur); }
  showOnly(0);
  function go(){
    step=(step+1)%4; prev=cur; cur=cycle[step]; dir=cur>prev?1:-1; measure();
    for(var i=0;i<tabs.length;i++) tabs[i].className='q32-c-tab'+(i===cur?' on':'');
    ux0=ux; uw0=uw; vx=0; vw=0;
    for(var k=0;k<pages.length;k++){ if(k!==cur&&k!==prev){pages[k].style.visibility='hidden';pages[k].style.opacity=0;} }
    pages[prev].style.visibility='visible'; pages[cur].style.visibility='visible';
    begin();
  }
  function tick(now){
    if(t0===null){ t0=now; last=now; }
    var dt=Math.min((now-last)/1000,0.05); last=now;
    var t=now-t0;
    if(t>=HOLD){ t0=now-(t-HOLD); t=now-t0; go(); }
    if(t<END) frame(t,dt); else settle(dt);
    put();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
