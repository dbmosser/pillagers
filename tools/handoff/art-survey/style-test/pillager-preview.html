<!doctype html>
<html><head><meta charset="utf-8"><title>pillager preview</title>
<style>html,body{margin:0;background:#4f8a2c;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="cv" width="1500" height="560"></canvas>
<script src="pix.js"></script>
<script src="pillager.js"></script>
<script>
window.onload = function () {
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  ctx.fillStyle = '#4f8a2c'; ctx.fillRect(0, 0, cv.width, cv.height);
  var ref = document.getElementById('ref'), now = document.getElementById('now');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(ref, 20, 20);
  ctx.drawImage(now, 380, 60);
  paintPixelPillager(ctx, 790, 450, 4);
  paintPixelPillager(ctx, 1040, 450, 4, { hood: '#2f6fd0', pads: '#2f6fd0' });
  paintPixelPillager(ctx, 1260, 450, 2);
  paintPixelPillager(ctx, 1420, 450, 1);
  ctx.fillStyle = '#eaf2dc'; ctx.font = '16px monospace'; ctx.textAlign = 'center';
  [['reference', 185], ['today', 515], ['pixel test x4', 790], ['blue look x4', 1040], ['pixel test x2', 1260], ['x1', 1420]].forEach(function (t) { ctx.fillText(t[0], t[1], 545); });
};
</script>
<div style="display:none"><img id="ref" src="crops/ref-pillager.png"><img id="now" src="crops/now-pillager.png"></div>
</body></html>
